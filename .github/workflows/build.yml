name: Build Dual APKs (Original + Admin Controller)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure CI debug keystore exists
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
              printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore
            elif [ -f debug.keystore.base64 ]; then
              tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Ensure google-services.json exists for both modules
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              FIRST_CHAR=$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | cut -c1)
              if [ "$FIRST_CHAR" = "{" ]; then
                printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              else
                printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | base64 -d > app/google-services.json
              fi
            else
              echo "::error::Missing app/google-services.json! AI Studio omits google-services.json when pushing to GitHub. Add GitHub Secret GOOGLE_SERVICES_JSON (Settings -> Secrets and variables -> Actions) OR upload app/google-services.json directly to the GitHub repository."
              exit 1
            fi
          fi
          if [ ! -f controller/google-services.json ]; then
            cp app/google-services.json controller/google-services.json
          fi

      - name: Build Both Debug APKs
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleDebug :controller:assembleDebug --no-daemon
          else
            gradle :app:assembleDebug :controller:assembleDebug --no-daemon
          fi

      - name: Prepare Dual APK Outputs & Verify Integrity
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/InstantTranslator-Original.apk
          cp controller/build/outputs/apk/debug/controller-debug.apk dist/InstantTranslator-AdminController.apk
          unzip -t dist/InstantTranslator-Original.apk
          unzip -t dist/InstantTranslator-AdminController.apk
          ls -lh dist/

      - name: Upload Original App APK
        uses: actions/upload-artifact@v4
        with:
          name: Download-Original-Translator-APK
          path: dist/InstantTranslator-Original.apk
          compression-level: 0

      - name: Upload Admin Controller APK
        uses: actions/upload-artifact@v4
        with:
          name: Download-Admin-Controller-APK
          path: dist/InstantTranslator-AdminController.apk
          compression-level: 0

      - name: Publish Both APKs to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest-debug"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/InstantTranslator-Original.apk dist/InstantTranslator-AdminController.apk --clobber
          else
            gh release create "$TAG" dist/InstantTranslator-Original.apk dist/InstantTranslator-AdminController.apk --title "InstantTranslator Dual APKs (Original + Admin Controller)" --notes "Download button 1: InstantTranslator-Original.apk | Download button 2: InstantTranslator-AdminController.apk"
          fi
